name: Warm board
# Every 5 minutes: asks for the board so Vercel's CDN always holds a fresh copy and visitors never wait
# for the upstream APIs. Prints how long each source took and any errors.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          code=$(curl -sS --max-time 120 -o out.json -w "%{http_code} %{time_total}s" https://tickerwave.vercel.app/api/board)
          echo "HTTP $code"
          jq -c '{timing, errors, stocks: (.stocks | length), chains: [.chains[].id], versions: ([.stocks[].versions[]] | group_by(.issuer + "@" + .chain) | map({(.[0].issuer + "@" + .[0].chain): length}) | add)}' out.json || head -c 600 out.json
          jq -c '.stocks[] | select(.ticker == "TSLA" or .ticker == "SPY" or .ticker == "NVDA") | {ticker, ref, v: [.versions[] | {symbol, chain, onchain, gap, liquidity, multiplier}]}' out.json || true
          test "${code%% *}" = 200
