name: Warm board
# Every 5 minutes: asks for the board so Vercel's CDN always holds a fresh copy and visitors never wait
# for the upstream APIs, then runs the alert check (which also saves the hourly peg history). Prints how long each
# source took, any errors, and what the peg history holds.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          code=$(curl -sS --max-time 120 -o out.json -w "%{http_code} %{time_total}s" https://usepegwatch.vercel.app/api/board)
          echo "HTTP $code"
          jq -c '{timing, errors, stocks: (.stocks | length), chains: [.chains[].id], versions: ([.stocks[].versions[]] | group_by(.issuer + "@" + .chain) | map({(.[0].issuer + "@" + .[0].chain): length}) | add)}' out.json || head -c 600 out.json
          jq -c '.stocks[] | select(.ticker == "TSLA" or .ticker == "SPY" or .ticker == "NVDA") | {ticker, ref, v: [.versions[] | {symbol, chain, onchain, gap, liquidity, multiplier}]}' out.json || true
          echo "Gaps over 5%:"; jq -c '[.stocks[] | . as $s | .versions[] | select(.gap != null and (.gap | fabs) > 0.05) | {t: $s.ticker, ref: $s.ref, symbol, chain, onchain, gap, liquidity, multiplier}]' out.json || true
          test "${code%% *}" = 200
      - name: Check alerts
        run: curl -sS --max-time 120 https://usepegwatch.vercel.app/api/check-alerts; echo
      - name: Peg history
        # the t= parameter skips the CDN copy so this shows what is saved right now
        run: |
          curl -sS --max-time 60 "https://usepegwatch.vercel.app/api/history?p=issuers&t=$(date +%s)"; echo
          curl -sS --max-time 60 "https://usepegwatch.vercel.app/api/history?v=NVDA_robinhood&t=$(date +%s)" | jq -c '{v, n: (.points | length), last: .points[-1]}' || true
          curl -sS --max-time 60 "https://usepegwatch.vercel.app/api/history?p=ranking&t=$(date +%s)" | jq -c '{hours, ranked: (.tokens | length), best: (.tokens[:3] | map({symbol, chain, typical, within, n})), worst: (.tokens[-1:] | map({symbol, chain, typical}))}' || true
          curl -sS --max-time 60 "https://usepegwatch.vercel.app/api/history?p=report&t=$(date +%s)" | jq -c '{live, week, weeks, report: (.report | if . then {week, hours, markets, steady, best: .best[0].symbol, worst: .worst[0].symbol, swing: .swing.symbol, issuers: [.issuers[].id]} else null end)}' || true
          curl -sS --max-time 60 "https://usepegwatch.vercel.app/api/history?p=weekend&t=$(date +%s)" | jq -c '{closed, week, latest: (.latest | if . then {week, t: .snap.t, stocks: (.snap.stocks | length), res: (.res // {} | keys)} else null end), past}' || true
